name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: pipeline smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas scikit-learn joblib

      - name: Run pipeline smoke test
        # train.py reads /data and serve.py reads /mnt/models (hard-coded AI Core
        # mount points). The smoke script stages files there, creating the dirs
        # with sudo since they aren't writable by the runner user by default.
        run: bash .claude/skills/run-pipeline/smoke.sh
